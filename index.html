<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개인정보처리방침</title>
<meta name="description" content="앱별 개인정보처리방침 모음.">
<meta name="robots" content="index, follow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
:root{
  --bg:#FBF5EF; --surface:#FFFCF9; --ink:#1C1B19; --muted:#6F675E;
  --accent:#43624A; --accent-soft:#E2EBE1; --line:#E8DCCF;
  --f-display:"Gothic A1","Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17181A; --surface:#1E2023; --ink:#ECE7E1; --muted:#9A948B;
    --accent:#8FB294; --accent-soft:#232F27; --line:#2D3034; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17181A; --surface:#1E2023; --ink:#ECE7E1; --muted:#9A948B;
  --accent:#8FB294; --accent-soft:#232F27; --line:#2D3034; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;}
img{max-width:100%}
.wrap{max-width:640px; margin:0 auto; padding-inline:20px; padding-block:72px 56px}
.eyebrow{font-family:var(--f-mono); font-size:12px; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
h1{font-family:var(--f-display); font-weight:800; font-size:clamp(28px,6vw,38px);
  letter-spacing:-.02em; line-height:1.25; margin:14px 0 10px; text-wrap:balance}
.sub{color:var(--muted); font-size:15px; margin:0 0 40px}

.list{display:grid; gap:12px; list-style:none; margin:0; padding:0}
.list a{
  display:flex; align-items:center; gap:16px; text-decoration:none; color:inherit;
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:18px 20px; transition:border-color .15s ease, transform .15s ease;
}
.list a:hover{border-color:var(--accent); transform:translateY(-1px)}
.list a:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.list svg{flex:none}
.meta{min-width:0; flex:1}
.meta b{display:block; font-family:var(--f-display); font-weight:800;
  font-size:17px; letter-spacing:-.01em}
.meta small{display:block; color:var(--muted); font-size:13.5px;
  font-family:var(--f-mono)}
.chev{color:var(--muted); flex:none}

footer{margin-top:48px; padding-top:22px; border-top:1px solid var(--line);
  color:var(--muted); font-size:13.5px}
footer code{font-family:var(--f-mono); font-size:13px;
  background:var(--accent-soft); padding:2px 6px; border-radius:5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">Privacy Policies</div>
  <h1>개인정보처리방침</h1>
  <p class="sub">앱별 개인정보처리방침입니다. 보려는 앱을 선택하세요.</p>

  <ul class="list">
    <li>
      <a href="./touchfree/">
        <svg width="40" height="40" viewBox="0 0 108 108" aria-hidden="true">
          <rect width="108" height="108" rx="24" fill="#F5EAE0"/>
          <circle cx="54" cy="54" r="33" fill="none" stroke="#1A1A1A" stroke-width="5.5" opacity=".4"/>
          <circle cx="54" cy="54" r="21" fill="none" stroke="#1A1A1A" stroke-width="5.5"/>
          <circle cx="54" cy="54" r="10" fill="#FFCDB8" stroke="#1A1A1A" stroke-width="5.5"/>
          <line x1="28.5" y1="79.5" x2="79.5" y2="28.5" stroke="#F5EAE0" stroke-width="13" stroke-linecap="round"/>
          <line x1="28.5" y1="79.5" x2="79.5" y2="28.5" stroke="#E5544B" stroke-width="6.5" stroke-linecap="round"/>
        </svg>
        <span class="meta">
          <b>터치프리</b>
          <small>com.touchfree.app</small>
        </span>
        <svg class="chev" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M6.5 3.5L12 9l-5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </li>
  </ul>

  <footer>
    앱이 늘어나면 <code>&lt;li&gt;</code> 블록을 복사해 이름과 링크만 바꾸고, 같은 이름의 폴더를 추가하면 됩니다.
  </footer>

</div>
</body>
</html>
